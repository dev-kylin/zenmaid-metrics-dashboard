<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZenMaid YouTube Dashboard</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--txt:#e8eaed;--muted:#9aa3b2;--accent:#4dd0c7;--down:#f87171;}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 28px;width:340px;max-width:90vw;}
h1{font-size:18px;margin:0 0 4px;font-weight:650;}
.muted{color:var(--muted);font-size:13px;margin:0 0 18px;}
input{width:100%;background:#0f1115;border:1px solid var(--line);border-radius:9px;color:var(--txt);padding:11px 12px;font-size:14px;margin-bottom:12px;}
button{width:100%;border:0;background:var(--accent);color:#0f1115;font-weight:700;font-size:14px;padding:12px;border-radius:10px;cursor:pointer;}
.err{color:var(--down);font-size:12.5px;min-height:16px;margin-top:12px;}
</style>
</head>
<body>

  <input id="p" type="password" placeholder="Password" autocomplete="current-password">
  <button type="submit">Unlock</button>

</form>

const _subtle = crypto.subtle;
function _ub64(str){const b=atob(str);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function _key(user,pass,salt,iter){
  const bk=await _subtle.importKey("raw",new TextEncoder().encode(user+"\n"+pass),"PBKDF2",false,["deriveKey"]);
  return _subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:iter,hash:"SHA-256"},bk,{name:"AES-GCM",length:256},false,["decrypt"]);
}
document.getElementById("f").addEventListener("submit",async function(e){
  e.preventDefault();
  const err=document.getElementById("err");
  const u=document.getElementById("u").value, p=document.getElementById("p").value;
  err.style.color="var(--muted)"; err.textContent="Decrypting...";
  try{
    const k=await _key(u,p,_ub64(PAYLOAD.salt),PAYLOAD.iter);
    const pt=await _subtle.decrypt({name:"AES-GCM",iv:_ub64(PAYLOAD.iv)},k,_ub64(PAYLOAD.ct));
    const html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
  }catch(ex){ err.style.color="var(--down)"; err.textContent="Incorrect username or password."; }
});
